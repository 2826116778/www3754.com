<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品管理后台 | Modern Shop</title>
  <meta name="description" content="商品管理后台，支持新增、编辑、删除和导出商品数据。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header admin-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Modern Shop</a>
      <div class="admin-tools">
        <a class="button button-secondary" href="index.html">回到首页</a>
      </div>
    </div>
  </header>

  <main>
    <section class="admin-panel">
      <div class="container section-header">
        <span class="eyebrow">后台管理</span>
        <h2>商城商品管理</h2>
        <p>快速管理商品信息，支持搜索、编辑、删除和导入导出数据。</p>
      </div>

      <div class="admin-actions">
        <div class="admin-search">
          <label for="product-search">搜索商品</label>
          <input id="product-search" type="search" placeholder="输入商品名称或分类" />
        </div>
        <div class="admin-export">
          <button class="button button-secondary" id="export-btn">导出商品数据</button>
          <label class="button button-primary file-input-label">
            导入 JSON
            <input id="import-file" type="file" accept="application/json" />
          </label>
          <div class="backend-sync" style="display:flex;gap:8px;align-items:center;margin-left:12px;">
            <input id="backend-url" type="url" placeholder="后端商品 JSON 地址（可选）" style="padding:6px;border-radius:6px;border:1px solid #ddd;" />
            <button class="button button-primary" id="sync-backend-btn">从后端同步并保存</button>
          </div>
          <div class="public-source" style="display:flex;gap:8px;align-items:center;margin-left:12px;">
            <input id="public-url" type="url" placeholder="公开产品 JSON 地址（前端优先读取）" style="padding:6px;border-radius:6px;border:1px solid #ddd;" />
            <button class="button button-secondary" id="set-public-url-btn">设置为前端数据源</button>
            <button class="button button-primary" id="publish-public-btn">发布到该 URL（POST）</button>
          </div>
        </div>
      </div>

      <div class="admin-grid">
        <section class="admin-form-card">
          <h3>新增 / 编辑商品</h3>
          <form id="product-form">
            <input type="hidden" id="product-id" />
            <label>商品名称
              <input id="product-name" type="text" placeholder="输入商品名称" required />
            </label>
            <label>分类
              <input id="product-category" type="text" placeholder="例如：电子、家居" required />
            </label>
            <label>价格（¥）
              <input id="product-price" type="number" min="0" step="0.01" placeholder="输入价格" required />
            </label>
            <label>库存数量
              <input id="product-stock" type="number" min="0" step="1" placeholder="输入库存数量" required />
            </label>
            <label>商品图片上传
              <input id="product-image-file" type="file" accept="image/*" />
            </label>
            <div class="image-preview" id="image-preview" style="display: none;">
              <img id="product-image-preview" alt="当前商品图片预览" />
            </div>
            <input type="hidden" id="product-image" />
            <label>商品描述
              <textarea id="product-description" rows="4" placeholder="商品亮点与说明"></textarea>
            </label>
            <div class="form-actions">
              <button class="button button-primary" type="submit">保存商品</button>
              <button class="button button-secondary" id="reset-form" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="admin-table-card">
          <h3>商品列表</h3>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>分类</th>
                  <th>价格</th>
                  <th>库存</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="product-table"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer admin-footer">
    <div class="container footer-inner">
      <p>后台数据保存在浏览器本地存储，刷新后仍可保留。</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="product-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
